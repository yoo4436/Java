<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@2.3.3/lib/bundles/stomp.umd.min.js"></script>
    </head>

    <body>
        <h1>Chat Room</h1>
        <hr>
        <div>
            Email: <input id="email"><br>
            Password: <input type="password" id="pw"><br>
            <button id="login">Login</button>
        </div>
        <p>登入狀態: <span id="status">味登入</span></p>
        <div id="chatDiv" style="display: none;">
            <div id="chatBox" style="border: 1px solid #ccc; width: 480px; height: 300px; overflow-y: scroll;" ></div>
            <input id="msg" style="width: 400px;">
            <button id="send">Send</button>
        </div>

        <script>
            document.getElementById("login").onclick = async() => {
                let email = document.getElementById("email").value;
                let pw = document.getElementById("pw").value;
            
                let resp = await fetch("/auth/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        "email": email,
                        "pw": pw
                    })
                });
                console.log(resp.ok)
                if (resp.ok) {
                    let data = await resp.json();
                    console.log(data);
                    token = data.token;
                    document.getElementById("status").innerHTML = "已登入";
                    document.getElementById("chatDiv").style.display = "block";
                }
            };
            
            document.getElementById("send").onclick = async() => {
                let input = document.getElementById("msg");
                let msg = input.value.trim();

                client.send('/app/chat/send',{},msg);

                input.value = '';
            };
        
            function connectWebSocket(){
                let socket = new SocketJS('/ws-chat?token=' +encodeURIComponent('Bearer ' + token));
                client = Stomp.over(socket);
                client.connect({}, function(frame){
                    console.log(frame);
                    client.subscribe("/topic/public", function(mesg){
                        console.log(mesg);
                        let body = msg.JSON.parse(mesg.body);
                        console.log(body);
                        console.log("----");
                        receiveMessage(body);
                    });

                });

            }

            function receiveMessage(msg){
                let box = document.getElementById("chatBox");
                let line = document.createElement("div");
                line.innerHTML = ``;
                box.appendChild(line);
            }

        </script>
    </body>

   
</html>
